server.port=8084
server.servlet.context-path=/helios-rating
spring.application.name=helios-rating

# Project Loom Virtual Threads
spring.threads.virtual.enabled=true

# External Database Configuration File Import (allows overriding DB location without touching WAR)
spring.config.import=optional:file:C:/helios-config/database.properties,optional:file:C:/helios-storage/database.properties,optional:file:./database.properties,optional:file:../database.properties

# SQL Server Configuration (HELIOS_RATING_DB)
helios2.db.server=dbtst.ads.netyx.net
helios2.db.port=1433
spring.datasource.url=jdbc:sqlserver://${helios2.db.server:dbtst.ads.netyx.net}:${helios2.db.port:1433};databaseName=HELIOS_RATING_DB;integratedSecurity=true;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=false
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Logging
logging.level.com.example.heliosrating=INFO
logging.level.org.springframework.web=INFO

