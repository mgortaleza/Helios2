server.port=8086
server.servlet.context-path=/helios-document
spring.application.name=helios-document

# Base Directory for File System Storage Provider
helios.documents.storage.path=C:/helios-storage/documents

# Dedicated DocGen Microservice Endpoint
docgen.service.url=http://127.0.0.1:8088/helios-docgen/api/v1/docgen

# Database Connectivity (Master Registry & Tenant Catalogs)
spring.datasource.url=jdbc:sqlserver://dbtst.ad.ortaleza.com:1433;databaseName=MSTR_DATA;integratedSecurity=true;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=false
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Logging
logging.level.com.example.heliosdocument=INFO
logging.level.org.springframework.web=INFO

