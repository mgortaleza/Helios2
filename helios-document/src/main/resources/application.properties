server.port=8086
server.servlet.context-path=/helios-document
spring.application.name=helios-document

# Project Loom Virtual Threads
spring.threads.virtual.enabled=true

# Dynamic Physical Storage Root (Dynamic fallback; overridden by dbo.system_configuration)
helios.storage.root.path=C:/helios-storage
helios.documents.storage.path=C:/helios-storage/documents

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Dedicated DocGen Microservice Endpoint
docgen.service.url=http://127.0.0.1:8088/helios-docgen/api/v1/docgen

# External Database Configuration File Import (allows overriding DB location without touching WAR)
spring.config.import=optional:file:C:/helios-config/database.properties,optional:file:C:/helios-storage/database.properties,optional:file:./database.properties,optional:file:../database.properties

# Database Connectivity (Master Registry & Tenant Catalogs)
helios2.db.server=dbtst.ads.netyx.net
helios2.db.port=1433
spring.datasource.url=jdbc:sqlserver://${helios2.db.server:dbtst.ads.netyx.net}:${helios2.db.port:1433};databaseName=MSTR_DATA;integratedSecurity=true;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=false
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Logging
logging.level.com.example.heliosdocument=INFO
logging.level.org.springframework.web=INFO

