# ===================================================================
# Helios2 Database Configuration (MSTR_DATA & Multi-Tenant Registry)
# ===================================================================
# This file provides a simple, easily editable external configuration
# for the database location of the MSTR_DATA master catalog and tenants.
#
# Changes in this file will automatically override application.properties.
# Restart the backend service / Tomcat to apply any changes.
# ===================================================================

# Hostname or IP of the SQL Server hosting MSTR_DATA
helios2.db.server=dbtst.ads.netyx.net

# Port of SQL Server (default: 1433)
helios2.db.port=1433

# Master Multi-Tenant Catalog name
helios2.db.master-catalog=MSTR_DATA

# Default Tenant Catalog name and Tenant ID
helios2.db.default-tenant-catalog=HELIOS2_TST
helios2.db.default-tenant-id=1

# Rating Database Catalog name (used by Helios-Admin and Helios-Rating)
helios2.db.rating-catalog=Helios_Rating_DB
