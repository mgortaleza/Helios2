# ============================================================================
# Helios Suite Multi-Port NGINX Configuration on APPTST (10.1.10.56)
# - Port 80   -> Helios2 Insurance Suite      -> Tomcat #1 (127.0.0.1:8080/helios2)
# - Port 8090 -> HeliosAdmin Control Plane    -> Tomcat #2 (127.0.0.1:8082/helios-admin)
# - Internal  -> HeliosRating Rules Engine    -> Tomcat #3 (127.0.0.1:8084/helios-rating)
# ============================================================================

worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # 1. Customer / Underwriting Application (Port 80 -> Tomcat #1 on 8080)
    server {
        listen       80 default_server;
        server_name  app.netyx.net 10.1.10.56 APPTST apptst.ad.ortaleza.com localhost;

        root   C:/nginx/html/helios2;
        index  index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Core Policy & Claims API (Tomcat #1)
        location /api/ {
            proxy_pass         http://127.0.0.1:8080/helios2/api/;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Tenant-ID       $http_x_tenant_id;

            proxy_connect_timeout 30s;
            proxy_read_timeout    60s;
        }

        # Rating & Rules Engine API (Tomcat #3)
        location /rating-api/ {
            proxy_pass         http://127.0.0.1:8084/helios-rating/api/v1/;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Tenant-ID       $http_x_tenant_id;

            proxy_connect_timeout 30s;
            proxy_read_timeout    60s;
        }
    }

    # 2. Admin Control Plane & RBAC Manager (Port 8090 -> Tomcat #2 on 8082)
    server {
        listen       8090;
        server_name  app.netyx.net 10.1.10.56 APPTST apptst.ad.ortaleza.com localhost;

        root   C:/nginx/html/helios-admin;
        index  index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Admin Control Plane API (Tomcat #2)
        location /api/ {
            proxy_pass         http://127.0.0.1:8082/helios-admin/api/;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Tenant-ID       $http_x_tenant_id;

            proxy_connect_timeout 30s;
            proxy_read_timeout    60s;
        }

        # Rating & Rules Admin API (Tomcat #3)
        location /rating-api/ {
            proxy_pass         http://127.0.0.1:8084/helios-rating/api/v1/;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Tenant-ID       $http_x_tenant_id;

            proxy_connect_timeout 30s;
            proxy_read_timeout    60s;
        }
    }
}
