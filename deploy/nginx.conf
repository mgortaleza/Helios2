# ============================================================================
# Helios2 — NGINX Configuration on APPTST (10.1.10.56)
# Serves the React-Admin static frontend and proxies /api/* to local Tomcat
# via IPv4 literal (127.0.0.1:8080) to avoid Windows IPv6 timeout delays.
# ============================================================================

worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    server {
        listen       80 default_server;
        server_name  app.netyx.net 10.1.10.56 APPTST apptst.ad.ortaleza.com localhost;

        # Path to built React-Admin frontend (copy contents of frontend/dist here)
        root   C:/nginx/html/helios2;
        index  index.html;

        # 1. Serve React-Admin SPA static assets
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static hashed assets produced by Vite
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 2. Reverse proxy /api/* requests to local Tomcat using IPv4 127.0.0.1:8080
        location /api/ {
            proxy_pass         http://127.0.0.1:8080/helios2/api/;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Forward multi-tenant routing header (MSTR_DATA tenant ID)
            proxy_set_header   X-Tenant-ID       $http_x_tenant_id;

            proxy_connect_timeout 30s;
            proxy_read_timeout    60s;
        }
    }
}
