spring.application.name=Helios2
server.port=8081
spring.sql.init.mode=never

# Project Loom Virtual Threads
spring.threads.virtual.enabled=true
server.servlet.session.timeout=15m

# External Database Configuration File Import (allows overriding DB location without touching WAR)
spring.config.import=optional:file:C:/helios-config/database.properties,optional:file:C:/helios-storage/database.properties,optional:file:./database.properties,optional:file:../database.properties

# Master Multi-Tenant Catalog Database (MSTR_DATA)
helios2.db.server=dbtst.ads.netyx.net
helios2.db.port=1433
helios2.db.master-catalog=MSTR_DATA
helios2.db.default-tenant-catalog=HELIOS2_TST
helios2.db.default-tenant-id=1

# Active Directory / Kerberos fallback settings for non-Windows hosts
helios2.krb5.realm=ADS.NETYX.NET
helios2.krb5.kdc=ads.netyx.net

# Standalone Helios-Rules (BRMS Drools) Rating Integration
helios2.rules.url=http://10.1.10.56:8085/helios2-brms
helios2.rules.tenant-id=HELIOS_US
helios2.rules.connect-timeout-ms=5000
